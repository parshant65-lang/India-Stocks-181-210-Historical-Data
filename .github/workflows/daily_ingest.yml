name: Ingest India Stocks 181-210 Daily 1m Klines

on:
  schedule:
    # Run every weekday Monday to Friday at 15:30 IST (10:00 UTC)
    - cron: '5 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas

      - name: Run Stocks 181-210 Ingestion
        run: |
          python fetch_batch.py

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily 1m kline capture for India Stocks 181-210" && git push)
